<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - مدرسة الأوائل الخاصة</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-olive: #284B35;
            --primary-olive-dark: #1C3626;
            --accent-gold: #C5A059;
            --bg-beige: #F9F7F2;
            --border-beige: #E8E3D7;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-beige);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 18px;
            border: 1px solid var(--border-beige);
            box-shadow: 0 10px 30px rgba(40, 75, 53, 0.08);
            overflow: hidden;
            background-color: #fff;
        }
        .login-header {
            background: linear-gradient(135deg, var(--primary-olive-dark) 0%, var(--primary-olive) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent-gold);
        }
        .school-logo-icon {
            background-color: rgba(197, 160, 89, 0.2);
            color: var(--accent-gold);
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            border: 1px solid var(--accent-gold);
        }
        .btn-olive {
            background-color: var(--primary-olive);
            color: white;
            font-weight: 700;
        }
        .btn-olive:hover { background-color: var(--primary-olive-dark); color: white; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="login-header">
        <div class="school-logo-icon mx-auto mb-2">
            <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h4 class="fw-bold mb-1">مدرسة الأوائل الخاصة</h4>
        <small style="color: var(--accent-gold);">بوابة إشعارات وتنبيهات أولياء الأمور</small>
    </div>
    <div class="p-4">
        <form onsubmit="handleLogin(event)">
            <div class="mb-3">
                <label class="form-label fw-bold small">اسم المستخدم:</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                    <input type="text" id="username" class="form-control" required placeholder="أدخل اسم المستخدم">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-bold small">كلمة المرور:</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="password" class="form-control" required placeholder="أدخل كلمة المرور">
                </div>
            </div>
            <div id="loginError" class="alert alert-danger py-2 small d-none">
                اسم المستخدم أو كلمة المرور غير صحيحة!
            </div>
            <button type="submit" class="btn btn-olive w-100 py-2 mt-2">
                <i class="bi bi-box-arrow-in-left me-1"></i> دخول إلى النظام
            </button>
        </form>
    </div>
</div>

<script>
    // إذا كان مسجل دخول مسبقاً، يحوله فوراً للصفحة الرئيسية
    if (sessionStorage.getItem('isLoggedIn') === 'true') {
        window.location.href = 'index.html';
    }

    function handleLogin(e) {
        e.preventDefault();
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const errBox = document.getElementById('loginError');

        if (u === 'AAA' && p === '159') {
            sessionStorage.setItem('isLoggedIn', 'true');
            // النقل الفوري للصفحة الرئيسية
            window.location.href = 'index.html';
        } else {
            errBox.classList.remove('d-none');
        }
    }
</script>
</body>
</html>
